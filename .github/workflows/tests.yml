name: CPU tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - run: python -m pip install torch==2.9.1+cpu torchvision==0.24.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-cpu.lock.txt
      - run: python -m pip install --no-deps .
      - run: make lint test
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
